/blueboat/controller/controller_manager:
  ros__parameters:
    update_rate: 200

    common_controllers:
      - thruster_test_controller

    usv_controllers:
      - body_force
      - body_velocity
      - position_hold

    hardware_components_initial_state:
      inactive:
        - blueboat_actuators
      active:
        - blueboat_thrusters
        - blueboat_sensors

    thruster_test_controller:
      type: forward_command_controller/ForwardCommandController

    status_light_controller:
      type: forward_command_controller/ForwardCommandController

    body_force:
      type: sura_controllers/usv/BodyForceController
    
    body_velocity:
      type: sura_controllers/usv/BodyVelocityController

    position_hold:
      type: sura_controllers/usv/PositionHoldController

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    magnetometer_broadcaster:
      type: sura_sensors/MagnetometerBroadcaster

    gps_broadcaster:
      type: sura_sensors/GpsBroadcaster

    altimeter_broadcaster:
      type: sura_sensors/AltimeterBlueboatBroadcaster

    multibeam_broadcaster:
      type: sura_sensors/MultibeamBroadcaster

    battery_broadcaster:
      type: sura_sensors/BatteryBroadcaster

/blueboat/controller/thruster_test_controller:
  ros__parameters:
    joints:
      - blueboat/left_thruster_joint
      - blueboat/right_thruster_joint
    interface_name: effort

/blueboat/controller/status_light_controller:
  ros__parameters:
    joints:
      - blueboat/status_light_joint
    interface_name: enabled

/blueboat/controller/body_force:
  ros__parameters:
    debug.enabled: true
    input_topic: /blueboat/controller/body_force/command
    output_topic: /blueboat/controller/body_force/output
    wrench_output_topic: /blueboat/controller/body_force/wrench
    base_link: blueboat/base_link
    thruster_joints:
      - blueboat/left_thruster_joint
      - blueboat/right_thruster_joint
    debug.topic: /blueboat/controller/debug

/blueboat/controller/body_velocity:
  ros__parameters:
    debug.enabled: true
    setpoint_topic: /blueboat/controller/body_velocity/setpoint
    navigator_topic: /blueboat/navigator/navigation
    feedforward_topic: /blueboat/controller/body_force/command
    output_topic: /blueboat/controller/body_velocity/output
    pid_terms_topic: /blueboat/controller/body_velocity/pid_terms
    body_force_controller_name: body_force
    debug.topic: /blueboat/controller/debug

    kp_u: 150.0
    ki_u: 30.0
    kd_u: 0.0
    integral_limit_u: 8.0

    kp_r: 150.0
    ki_r: 30.0
    kd_r: 0.0
    integral_limit_r: 6.0


/blueboat/controller/position_hold:
  ros__parameters:
    debug.enabled: true
    setpoint_topic: /blueboat/controller/position_hold/setpoint
    feedforward_topic: /blueboat/controller/position_hold/feedforward
    reposition_feedforward_topic: /blueboat/controller/position_hold/reposition_feedforward
    navigator_topic: /blueboat/navigator/navigation
    output_topic: /blueboat/controller/position_hold/output
    pid_terms_topic: /blueboat/controller/position_hold/pid_terms
    threshold_markers_topic: /blueboat/controller/position_hold/threshold_markers
    body_velocity_controller_name: body_velocity
    body_velocity_setpoint_topic: /blueboat/controller/body_velocity/setpoint
    setpoint_frame_id: world_ned
    debug.topic: /blueboat/controller/debug

    linear_feedforward_threshold: 0.001
    angular_feedforward_threshold: 0.001
    feedforward_timeout: 0.25

    # APPROACH
    kp_position: 0.6
    kp_yaw: 0.8
    max_linear_speed: 0.20
    max_angular_speed: 0.25

    slow_down_radius: 1.2
    heading_error_stop: 0.70

    # Entrada/salida de hold con histéresis
    position_hold_radius: 0.30
    position_release_radius: 0.65

    yaw_tolerance: 0.12

    reverse_distance_threshold: 1.0
    max_reverse_speed: 0.0

    # HOLD
    hold_position_deadband: 0.12
    hold_yaw_deadband: 0.12

    hold_kp_position: 0.25
    hold_kp_yaw: 0.6

    hold_max_linear_speed: 0.05
    hold_max_angular_speed: 0.10

/blueboat/controller/navigator_bridge:
  ros__parameters:
    linear_lpf_alpha: 0.50

/blueboat/controller/thrusters_system:
  ros__parameters:
    thruster_lpf_alpha: 0.20

/blueboat/controller/imu_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: blueboat/imu_link

/blueboat/controller/magnetometer_broadcaster:
  ros__parameters:
    sensor_name: magnetometer_sensor
    frame_id: blueboat/imu_link
    topic_name: /blueboat/magnetometer_broadcaster/mag
    yaw_topic_name: /sura/sensors/gps/yaw_init
    yaw_offset_rad: 0.0

/blueboat/controller/gps_broadcaster:
  ros__parameters:
    sensor_name: gps_sensor
    frame_id: gps_frame
    topic_name: /blueboat/sensors/gps
    position_covariance: 0.0

/blueboat/controller/battery_broadcaster:
  ros__parameters:
    sensor_name: battery_sensor
    frame_id: blueboat/base_link
    topic_name: /blueboat/sensors/battery

/blueboat/controller/altimeter_broadcaster:
  ros__parameters:
    sensor_name: altimeter_sensor
    frame_id: blueboat/altimeter_link
    topic_name: /blueboat/sensors/altimeter
    field_of_view: 0.0
    min_range: 0.02
    max_range: 50.0

/blueboat/controller/multibeam_broadcaster:
  ros__parameters:
    sensor_name: multibeam_sensor
    frame_id: blueboat/multibeam_link
    points_topic: sensors/multibeam/points
    ping_topic: sensors/multibeam/ping
    up_vector_topic: sensors/multibeam/attitude/up_vector
    temperature_topic: sensors/multibeam/temperature
    pressure_topic: sensors/multibeam/pressure
    publish_period_s: 0.05
    stale_timeout_s: 3.0
